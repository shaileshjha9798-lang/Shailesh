<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Try — Creators & Brands, Connected</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14151c;
    --ink-soft:#4a4b57;
    --paper:#f2efe6;
    --paper-raised:#ffffff;
    --line:#dedad0;
    --flash:#ff3e6c;
    --flash-dim:#ffe1e9;
    --signal:#4b4efc;
    --signal-dim:#e4e4ff;
    --ok:#1b8a5a;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{
    font-family:'Fraunces',serif;
    font-weight:500;
    letter-spacing:-0.01em;
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--flash);color:#fff;}

  #root{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Landing ---------- */
  .landing-nav{
    display:flex;justify-content:space-between;align-items:center;
    padding:22px 40px;border-bottom:1px solid var(--line);
  }
  .brandmark{font-family:'Fraunces',serif;font-weight:600;font-size:22px;letter-spacing:-0.02em;}
  .brandmark em{font-style:italic;color:var(--flash);}
  .nav-cta{
    border:1px solid var(--ink);background:transparent;color:var(--ink);
    padding:9px 18px;border-radius:var(--radius);font-size:14px;font-weight:500;
  }
  .nav-cta:hover{background:var(--ink);color:var(--paper);}

  .hero{
    display:grid;grid-template-columns:1.15fr 0.85fr;gap:40px;
    padding:90px 40px 70px;max-width:1180px;margin:0 auto;align-items:end;
  }
  .hero h1{
    font-size:clamp(40px,5.4vw,74px);
    line-height:1.02;margin:0 0 26px;
  }
  .hero p.lede{
    font-size:18px;color:var(--ink-soft);max-width:480px;margin:0 0 32px;
  }
  .hero-actions{display:flex;gap:14px;flex-wrap:wrap;}
  .btn-primary{
    background:var(--ink);color:var(--paper);border:1px solid var(--ink);
    padding:14px 26px;border-radius:var(--radius);font-size:15px;font-weight:600;
  }
  .btn-primary:hover{background:#000;}
  .btn-secondary{
    background:transparent;color:var(--ink);border:1px solid var(--ink);
    padding:14px 26px;border-radius:var(--radius);font-size:15px;font-weight:600;
  }
  .btn-secondary:hover{background:var(--ink);color:var(--paper);}

  .hero-panel{
    border:1px solid var(--line);background:var(--paper-raised);
    padding:26px;border-radius:var(--radius);
  }
  .hero-panel .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .hero-panel .row:last-child{border-bottom:none;}
  .hero-panel .row b{font-family:'Fraunces',serif;font-weight:600;}
  .tag-creator{color:var(--flash);}
  .tag-brand{color:var(--signal);}

  .strip{
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    display:grid;grid-template-columns:repeat(3,1fr);
  }
  .strip .cell{padding:34px 40px;border-right:1px solid var(--line);}
  .strip .cell:last-child{border-right:none;}
  .strip .cell .num{font-family:'Fraunces',serif;font-size:34px;color:var(--flash);}
  .strip .cell p{color:var(--ink-soft);margin:6px 0 0;font-size:14px;}

  .how{max-width:1180px;margin:0 auto;padding:80px 40px;}
  .how h2{font-size:34px;margin:0 0 40px;}
  .how-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;}
  .how-grid .step{border-left:2px solid var(--flash);padding-left:20px;}
  .how-grid .step h3{font-size:19px;margin:0 0 8px;}
  .how-grid .step p{color:var(--ink-soft);font-size:14px;margin:0;}

  .cta-band{
    background:var(--ink);color:var(--paper);padding:70px 40px;text-align:left;
  }
  .cta-inner{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;}
  .cta-inner h2{color:var(--paper);font-size:32px;margin:0;}
  .cta-inner .btn-primary{background:var(--flash);border-color:var(--flash);color:#fff;}
  .cta-inner .btn-primary:hover{background:#e8235a;}

  .landing-footer{padding:24px 40px;color:var(--ink-soft);font-size:13px;text-align:center;}

  @media (max-width:820px){
    .hero{grid-template-columns:1fr;padding:50px 22px;}
    .strip{grid-template-columns:1fr;}
    .strip .cell{border-right:none;border-bottom:1px solid var(--line);}
    .how-grid{grid-template-columns:1fr;}
    .landing-nav{padding:18px 22px;}
    .cta-inner{flex-direction:column;align-items:flex-start;}
  }

  /* ---------- Onboarding ---------- */
  .onb-wrap{
    max-width:560px;margin:0 auto;padding:70px 22px;flex:1;width:100%;
  }
  .onb-wrap .back{font-size:13px;color:var(--ink-soft);border:none;background:none;margin-bottom:26px;padding:0;}
  .onb-wrap h1{font-size:32px;margin:0 0 8px;}
  .onb-wrap p.sub{color:var(--ink-soft);margin:0 0 34px;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .role-card{
    border:1.5px solid var(--line);border-radius:var(--radius);padding:26px 20px;
    text-align:left;background:var(--paper-raised);
  }
  .role-card:hover{border-color:var(--ink);}
  .role-card .dot{width:10px;height:10px;border-radius:50%;margin-bottom:14px;}
  .role-card.creator .dot{background:var(--flash);}
  .role-card.brand .dot{background:var(--signal);}
  .role-card h3{margin:0 0 6px;font-size:19px;}
  .role-card p{margin:0;color:var(--ink-soft);font-size:13.5px;}

  .field{margin-bottom:18px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  .field .hint{font-size:12px;color:var(--ink-soft);font-weight:400;margin-left:6px;}
  .field input, .field textarea, .field select{
    width:100%;border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 12px;font-family:inherit;font-size:14.5px;background:var(--paper-raised);color:var(--ink);
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--ink);outline-offset:1px;}
  .field textarea{resize:vertical;min-height:80px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  /* ---------- App shell ---------- */
  .app-shell{display:flex;flex:1;min-height:100vh;}
  .sidebar{
    width:220px;border-right:1px solid var(--line);padding:24px 18px;
    display:flex;flex-direction:column;flex-shrink:0;
  }
  .sidebar .brandmark{margin-bottom:30px;padding-left:6px;}
  .side-link{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);
    font-size:14.5px;font-weight:500;color:var(--ink-soft);border:none;background:none;text-align:left;width:100%;margin-bottom:2px;
  }
  .side-link:hover{background:var(--paper-raised);color:var(--ink);}
  .side-link.active{background:var(--ink);color:var(--paper);}
  .side-link .badge{
    margin-left:auto;background:var(--flash);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px;
  }
  .side-link.active .badge{background:var(--paper);color:var(--ink);}
  .sidebar-bottom{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);}
  .me-card{display:flex;align-items:center;gap:10px;padding:8px 6px;}
  .avatar{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:600;font-size:14px;color:#fff;
  }
  .me-name{font-size:13.5px;font-weight:600;line-height:1.2;}
  .me-role{font-size:11.5px;color:var(--ink-soft);}
  .logout-btn{border:none;background:none;font-size:12px;color:var(--ink-soft);padding:6px;margin-top:4px;}
  .logout-btn:hover{color:var(--flash);}

  .main{flex:1;padding:34px 42px;max-width:1000px;overflow-x:hidden;}
  .main h1{font-size:28px;margin:0 0 4px;}
  .main .page-sub{color:var(--ink-soft);font-size:14px;margin:0 0 26px;}

  .filter-row{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;}
  .filter-row select, .filter-row input{
    border:1px solid var(--line);border-radius:var(--radius);padding:9px 12px;font-size:13.5px;
    font-family:inherit;background:var(--paper-raised);
  }
  .filter-row input{flex:1;min-width:180px;}

  .card-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .p-card{
    border:1px solid var(--line);border-radius:var(--radius);padding:20px;background:var(--paper-raised);
  }
  .p-card-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;}
  .p-card h3{margin:0;font-size:17px;}
  .p-card .role-pill{
    display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;margin-top:4px;
  }
  .role-pill.creator{background:var(--flash-dim);color:var(--flash);}
  .role-pill.brand{background:var(--signal-dim);color:var(--signal);}
  .p-card .niche{font-size:12.5px;color:var(--ink-soft);margin:4px 0 0;}
  .p-card .bio{font-size:13.5px;color:var(--ink-soft);margin:10px 0 14px;line-height:1.5;}
  .p-card .meta-line{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}
  .p-card .actions{display:flex;gap:8px;}
  .btn-small{
    border:1px solid var(--ink);background:transparent;padding:8px 14px;border-radius:var(--radius);
    font-size:13px;font-weight:600;
  }
  .btn-small:hover{background:var(--ink);color:var(--paper);}
  .btn-small.primary{background:var(--ink);color:var(--paper);}
  .btn-small.primary:hover{background:#000;}
  .btn-small.ghost{border-color:var(--line);color:var(--ink-soft);}
  .btn-small.ghost:hover{border-color:var(--ink);color:var(--ink);background:none;}

  .empty{
    border:1px dashed var(--line);border-radius:var(--radius);padding:50px 30px;text-align:center;color:var(--ink-soft);
  }
  .empty h3{color:var(--ink);margin:0 0 8px;}

  /* Requests */
  .tab-row{display:flex;gap:4px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  .tab-btn{
    border:none;background:none;padding:10px 4px;margin-right:22px;font-size:14px;font-weight:600;
    color:var(--ink-soft);border-bottom:2px solid transparent;
  }
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--flash);}
  .req-item{
    border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;background:var(--paper-raised);
    display:flex;justify-content:space-between;gap:14px;align-items:flex-start;
  }
  .req-item .left b{font-family:'Fraunces',serif;font-size:16px;}
  .req-item .type-tag{
    display:inline-block;font-size:11px;font-weight:600;background:var(--paper);border:1px solid var(--line);
    padding:2px 8px;border-radius:10px;margin-left:8px;
  }
  .req-item .msg{font-size:13.5px;color:var(--ink-soft);margin-top:6px;max-width:480px;}
  .req-item .actions{display:flex;gap:8px;flex-shrink:0;}
  .status-pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:10px;}
  .status-pill.accepted{background:#e3f5eb;color:var(--ok);}
  .status-pill.declined{background:#fbe4e4;color:#c23a3a;}

  /* Messages */
  .msg-shell{display:flex;border:1px solid var(--line);border-radius:var(--radius);height:560px;background:var(--paper-raised);}
  .conv-list{width:250px;border-right:1px solid var(--line);overflow-y:auto;flex-shrink:0;}
  .conv-item{padding:14px 16px;border-bottom:1px solid var(--line);}
  .conv-item.active{background:var(--paper);}
  .conv-item button{width:100%;text-align:left;background:none;border:none;font-family:inherit;}
  .conv-item b{font-size:14px;}
  .conv-item .last{font-size:12px;color:var(--ink-soft);display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chat-col{flex:1;display:flex;flex-direction:column;}
  .chat-head{padding:14px 20px;border-bottom:1px solid var(--line);font-weight:600;font-family:'Fraunces',serif;font-size:16px;}
  .chat-body{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:10px;}
  .bubble{max-width:70%;padding:9px 13px;border-radius:10px;font-size:13.5px;line-height:1.4;}
  .bubble.mine{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:2px;}
  .bubble.theirs{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:2px;}
  .chat-input{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line);}
  .chat-input input{flex:1;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;font-family:inherit;font-size:14px;}
  .chat-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:14px;}

  /* Profile / modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,21,28,0.45);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .modal{background:var(--paper-raised);border-radius:var(--radius);max-width:460px;width:100%;padding:28px;max-height:88vh;overflow-y:auto;}
  .modal h2{margin:0 0 4px;font-size:22px;}
  .modal .close{position:absolute;}
  .modal-close-x{float:right;border:none;background:none;font-size:20px;color:var(--ink-soft);line-height:1;}
  .type-select{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .type-opt{border:1px solid var(--line);padding:7px 13px;border-radius:14px;font-size:12.5px;font-weight:600;background:none;}
  .type-opt.selected{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .profile-view .p-header{display:flex;gap:16px;align-items:center;margin-bottom:20px;}
  .profile-view .avatar{width:56px;height:56px;font-size:20px;}
  .profile-view .p-links{font-size:13px;color:var(--ink-soft);margin-top:16px;}
  .profile-form-actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .saved-note{font-size:12.5px;color:var(--ok);}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:var(--radius);font-size:13.5px;
    z-index:100;
  }

  @media (max-width:900px){
    .app-shell{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;align-items:center;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto;padding:12px 16px;}
    .sidebar .brandmark{margin:0 16px 0 0;}
    .side-link{width:auto;white-space:nowrap;}
    .sidebar-bottom{display:none;}
    .main{padding:24px 18px;}
    .card-grid{grid-template-columns:1fr;}
    .msg-shell{flex-direction:column;height:auto;}
    .conv-list{width:100%;max-height:180px;border-right:none;border-bottom:1px solid var(--line);}
    .field-row{grid-template-columns:1fr;}
    .role-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function(){
  "use strict";

  /* ---------------- storage helpers ---------------- */
  async function sget(key, shared){
    try{ const r = await window.storage.get(key, !!shared); return r ? r.value : null; }
    catch(e){ return null; }
  }
  async function sset(key, value, shared){
    try{ await window.storage.set(key, value, !!shared); return true; }
    catch(e){ console.error('storage set failed', e); return false; }
  }

  const DIR_KEY = 'try_directory_v1';
  const REQ_KEY = 'try_requests_v1';
  const MSG_KEY = 'try_messages_v1';
  const MY_ID_KEY = 'try_my_id_v1';

  let directory = {};   // id -> profile
  let requests = {};    // id -> request
  let messages = {};    // conversationKey -> [ {from, text, ts} ]
  let myId = null;
  let ready = false;

  const AVATAR_COLORS = ['#ff3e6c','#4b4efc','#1b8a5a','#c77f00','#8f4bff','#0e9aa7'];
  function avatarColor(id){
    let h=0; for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i))>>>0;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }
  function initials(name){
    return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  }
  function uid(prefix){
    return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }
  function convKey(a,b){ return [a,b].sort().join('__'); }
  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ---------------- seed demo data ---------------- */
  function seedProfiles(){
    const demo = [
      {role:'creator', name:'Riya Kapoor', niche:'Beauty & Skincare', bio:'Skincare-first content, weekly product breakdowns and honest reviews for a 20–30 audience.', metric:'184K followers', location:'Mumbai', links:'instagram.com/riya.kapoor'},
      {role:'creator', name:'Arjun Mehta', niche:'Tech & Gadgets', bio:'Unboxings, comparisons and buying guides. I turn spec sheets into decisions people actually trust.', metric:'96K subscribers', location:'Bengaluru', links:'youtube.com/@arjunmehta'},
      {role:'creator', name:'Sana Iqbal', niche:'Fitness & Wellness', bio:'Home-workout series and mobility content for people who hate gyms but want to move well.', metric:'310K followers', location:'Delhi', links:'instagram.com/sana.moves'},
      {role:'creator', name:'Devansh Rao', niche:'Finance & Career', bio:'Breaking down personal finance and career decisions in plain language, no jargon.', metric:'78K subscribers', location:'Pune', links:'youtube.com/@devanshrao'},
      {role:'creator', name:'Meera Nair', niche:'Food & Travel', bio:'Regional food stories and budget travel diaries across South India.', metric:'142K followers', location:'Kochi', links:'instagram.com/meera.eats'},
      {role:'creator', name:'Kabir Sethi', niche:'Comedy & Sketches', bio:'Short-form sketches on everyday Indian office life. Fast turnaround on brand tie-ins.', metric:'520K followers', location:'Delhi', links:'instagram.com/kabir.sethi'},
      {role:'brand', name:'Northgrain Foods', niche:'D2C Nutrition', bio:'We make protein-first snacks. Looking for authentic creators to run honest taste-test content.', metric:'₹40K–₹2L per collab', location:'Gurugram', links:'northgrainfoods.com'},
      {role:'brand', name:'Loopwear', niche:'Sustainable Fashion', bio:'Recycled-fabric apparel brand building a creator community for seasonal drops.', metric:'₹25K–₹1.5L per collab', location:'Bengaluru', links:'loopwear.in'},
      {role:'brand', name:'Finlyt', niche:'Fintech / Investing App', bio:'Investing app for first-time investors. We sponsor finance and career creators long-term.', metric:'₹1L–₹5L per collab', location:'Mumbai', links:'finlyt.app'},
      {role:'brand', name:'Kettlebell Co.', niche:'Fitness Equipment', bio:'Home-gym equipment brand. We send gear + pay for honest, unscripted reviews.', metric:'₹15K–₹80K per collab', location:'Pune', links:'kettlebellco.in'},
      {role:'brand', name:'Southbowl', niche:'Food Delivery', bio:'Regional-cuisine delivery startup expanding to 5 new cities. Seeking food & city creators.', metric:'₹20K–₹1L per collab', location:'Hyderabad', links:'southbowl.co'},
      {role:'brand', name:'Pixelferry', niche:'SaaS / Productivity Tool', bio:'Productivity tool for freelancers. Looking for tech and career creators for long-term ambassadorships.', metric:'₹50K–₹3L per collab', location:'Remote', links:'pixelferry.io'}
    ];
    const dir = {};
    demo.forEach(p=>{
      const id = uid('demo');
      dir[id] = Object.assign({id, createdAt:Date.now(), demo:true}, p);
    });
    return dir;
  }

  /* ---------------- boot ---------------- */
  async function boot(){
    const [dirRaw, reqRaw, msgRaw, myIdRaw] = await Promise.all([
      sget(DIR_KEY, true), sget(REQ_KEY, true), sget(MSG_KEY, true), sget(MY_ID_KEY, false)
    ]);
    directory = dirRaw ? JSON.parse(dirRaw) : {};
    if(!dirRaw || Object.keys(directory).length===0){
      directory = seedProfiles();
      await sset(DIR_KEY, JSON.stringify(directory), true);
    }
    requests = reqRaw ? JSON.parse(reqRaw) : {};
    messages = msgRaw ? JSON.parse(msgRaw) : {};
    myId = myIdRaw || null;
    if(myId && !directory[myId]) myId = null;
    ready = true;
    route();
  }

  async function persistDirectory(){ await sset(DIR_KEY, JSON.stringify(directory), true); }
  async function persistRequests(){ await sset(REQ_KEY, JSON.stringify(requests), true); }
  async function persistMessages(){ await sset(MSG_KEY, JSON.stringify(messages), true); }
  async function persistMyId(){ await sset(MY_ID_KEY, myId || '', false); }

  /* ---------------- app state ---------------- */
  let view = 'landing';       // landing | onboard-role | onboard-profile | app
  let appTab = 'discover';    // discover | requests | messages | profile
  let onboardRole = null;
  let reqTab = 'incoming';
  let activeConv = null;
  let discoverNiche = '';
  let discoverSearch = '';
  let toastMsg = null;
  let composeTarget = null;   // id of profile being sent a request
  let composeType = 'Collaboration';
  let profileEditing = false;

  function showToast(msg){
    toastMsg = msg;
    render();
    setTimeout(()=>{ toastMsg=null; render(); }, 2200);
  }

  function route(){
    if(!ready){ render(); return; }
    view = myId ? 'app' : 'landing';
    render();
  }

  /* ---------------- render root ---------------- */
  const root = document.getElementById('root');

  function render(){
    if(!ready){ root.innerHTML = '<div style="padding:60px;text-align:center;color:#4a4b57;font-family:Inter,sans-serif;">Loading Try…</div>'; return; }
    let html = '';
    if(view==='landing') html = renderLanding();
    else if(view==='onboard-role') html = renderOnboardRole();
    else if(view==='onboard-profile') html = renderOnboardProfile();
    else if(view==='app') html = renderApp();
    if(toastMsg) html += `<div class="toast">${escapeHtml(toastMsg)}</div>`;
    root.innerHTML = html;
    attachHandlers();
  }

  /* ---------------- LANDING ---------------- */
  function renderLanding(){
    return `
    <div class="landing-nav">
      <div class="brandmark">Try<em>.</em></div>
      <button class="nav-cta" data-act="start">Get started</button>
    </div>
    <div class="hero">
      <div>
        <h1>Creators and brands,<br>actually connected.</h1>
        <p class="lede">Try is where creators and companies find each other directly — for sponsorships, collaborations, promotions and long-term partnerships. No agencies, no cold DMs.</p>
        <div class="hero-actions">
          <button class="btn-primary" data-act="start">Create your profile</button>
          <button class="btn-secondary" data-act="browse">Browse without signing up</button>
        </div>
      </div>
      <div class="hero-panel">
        <div class="row"><span class="tag-creator">● Creator</span> <b>Sana Iqbal</b></div>
        <div class="row">Fitness & Wellness · 310K followers</div>
        <div class="row" style="border-top:2px dashed var(--line);margin-top:6px;padding-top:14px;">
          <span class="tag-brand">● Brand</span> <b>Kettlebell Co.</b>
        </div>
        <div class="row">sent a sponsorship request</div>
        <div class="row"><span style="color:var(--ok);font-weight:600;">✓ Accepted</span> <span>Now messaging</span></div>
      </div>
    </div>
    <div class="strip">
      <div class="cell"><div class="num">1,200+</div><p>creators & brands on Try</p></div>
      <div class="cell"><div class="num">Direct</div><p>no middleman between the two sides</p></div>
      <div class="cell"><div class="num">Built-in</div><p>requests, chat and deal type all in one place</p></div>
    </div>
    <div class="how">
      <h2>How it works</h2>
      <div class="how-grid">
        <div class="step"><h3>Build a real profile</h3><p>Say who you are, your niche or industry, and what you're looking for — a collab, a sponsorship, or a promotion.</p></div>
        <div class="step"><h3>Discover the other side</h3><p>Creators browse brands, brands browse creators. Filter by niche and read the profile before reaching out.</p></div>
        <div class="step"><h3>Request, accept, talk</h3><p>Send a request with your intent. Once it's accepted, you're straight into a conversation — no forms, no agency.</p></div>
      </div>
    </div>
    <div class="cta-band">
      <div class="cta-inner">
        <h2>Set up your profile in two minutes.</h2>
        <button class="btn-primary" data-act="start">Get started</button>
      </div>
    </div>
    <div class="landing-footer">Try — a place for creators and companies to grow together.</div>
    `;
  }

  /* ---------------- ONBOARD: role ---------------- */
  function renderOnboardRole(){
    return `
    <div class="onb-wrap">
      <button class="back" data-act="to-landing">← Back</button>
      <h1>Who are you on Try?</h1>
      <p class="sub">This decides what your profile shows and who you'll discover.</p>
      <div class="role-grid">
        <button class="role-card creator" data-act="pick-role" data-role="creator">
          <div class="dot"></div>
          <h3>I'm a Creator</h3>
          <p>Influencer, YouTuber, streamer or content creator looking for brand deals and collabs.</p>
        </button>
        <button class="role-card brand" data-act="pick-role" data-role="brand">
          <div class="dot"></div>
          <h3>I'm a Brand</h3>
          <p>A company or startup looking for creators to sponsor, promote or partner with.</p>
        </button>
      </div>
    </div>`;
  }

  /* ---------------- ONBOARD: profile form ---------------- */
  function renderOnboardProfile(){
    const isCreator = onboardRole === 'creator';
    return `
    <div class="onb-wrap">
      <button class="back" data-act="to-role">← Back</button>
      <h1>${isCreator ? 'Your creator profile' : 'Your brand profile'}</h1>
      <p class="sub">${isCreator ? 'This is what brands will see when they discover you.' : 'This is what creators will see when they discover you.'}</p>
      <form id="profile-form">
        <div class="field">
          <label>${isCreator ? 'Your name' : 'Company name'}</label>
          <input name="name" required placeholder="${isCreator ? 'e.g. Riya Kapoor' : 'e.g. Northgrain Foods'}">
        </div>
        <div class="field-row">
          <div class="field">
            <label>${isCreator ? 'Content niche' : 'Industry'}</label>
            <input name="niche" required placeholder="${isCreator ? 'e.g. Fitness & Wellness' : 'e.g. D2C Nutrition'}">
          </div>
          <div class="field">
            <label>Location</label>
            <input name="location" placeholder="e.g. Mumbai / Remote">
          </div>
        </div>
        <div class="field">
          <label>${isCreator ? 'Reach' : 'Typical budget per collab'} <span class="hint">shown on your card</span></label>
          <input name="metric" required placeholder="${isCreator ? 'e.g. 120K followers' : 'e.g. ₹30K–₹1.5L per collab'}">
        </div>
        <div class="field">
          <label>${isCreator ? 'Instagram / YouTube / website' : 'Website'}</label>
          <input name="links" placeholder="e.g. instagram.com/yourname">
        </div>
        <div class="field">
          <label>Short bio</label>
          <textarea name="bio" required placeholder="${isCreator ? 'What you make content about, and what kind of brands you want to work with.' : 'What you sell, and what kind of creators you\\'re looking for.'}"></textarea>
        </div>
        <button type="submit" class="btn-primary" style="width:100%;">Create profile</button>
      </form>
    </div>`;
  }

  /* ---------------- APP SHELL ---------------- */
  function renderApp(){
    const me = directory[myId];
    if(!me) return renderLanding();
    const incomingCount = Object.values(requests).filter(r=>r.toId===myId && r.status==='pending').length;
    return `
    <div class="app-shell">
      <div class="sidebar">
        <div class="brandmark">Try<em>.</em></div>
        <button class="side-link ${appTab==='discover'?'active':''}" data-act="tab" data-tab="discover">Discover</button>
        <button class="side-link ${appTab==='requests'?'active':''}" data-act="tab" data-tab="requests">Requests ${incomingCount?`<span class="badge">${incomingCount}</span>`:''}</button>
        <button class="side-link ${appTab==='messages'?'active':''}" data-act="tab" data-tab="messages">Messages</button>
        <button class="side-link ${appTab==='profile'?'active':''}" data-act="tab" data-tab="profile">My Profile</button>
        <div class="sidebar-bottom">
          <div class="me-card">
            <div class="avatar" style="background:${avatarColor(me.id)}">${initials(me.name)}</div>
            <div>
              <div class="me-name">${escapeHtml(me.name)}</div>
              <div class="me-role">${me.role==='creator'?'Creator':'Brand'}</div>
            </div>
          </div>
          <button class="logout-btn" data-act="logout">Switch profile / log out</button>
        </div>
      </div>
      <div class="main">
        ${appTab==='discover' ? renderDiscover(me) : ''}
        ${appTab==='requests' ? renderRequests(me) : ''}
        ${appTab==='messages' ? renderMessages(me) : ''}
        ${appTab==='profile' ? renderProfileTab(me) : ''}
      </div>
    </div>
    ${composeTarget ? renderComposeModal() : ''}
    `;
  }

  /* ---------------- DISCOVER ---------------- */
  function renderDiscover(me){
    const oppositeRole = me.role==='creator' ? 'brand' : 'creator';
    let list = Object.values(directory).filter(p=>p.role===oppositeRole && p.id!==me.id);
    if(discoverNiche) list = list.filter(p=>p.niche.toLowerCase().includes(discoverNiche.toLowerCase()));
    if(discoverSearch) list = list.filter(p=>
      p.name.toLowerCase().includes(discoverSearch.toLowerCase()) ||
      p.bio.toLowerCase().includes(discoverSearch.toLowerCase())
    );
    const niches = [...new Set(Object.values(directory).filter(p=>p.role===oppositeRole).map(p=>p.niche))];

    const cards = list.map(p=>{
      const existing = Object.values(requests).find(r =>
        (r.fromId===me.id && r.toId===p.id) || (r.fromId===p.id && r.toId===me.id)
      );
      let actionHtml = `<button class="btn-small primary" data-act="open-compose" data-id="${p.id}">Send request</button>`;
      if(existing){
        if(existing.status==='pending') actionHtml = `<span class="status-pill" style="background:#fdf0dc;color:#a6690a;">Pending</span>`;
        else if(existing.status==='accepted') actionHtml = `<button class="btn-small" data-act="tab" data-tab="messages">Message</button>`;
        else if(existing.status==='declined') actionHtml = `<span class="status-pill declined">Declined</span>`;
      }
      return `
      <div class="p-card">
        <div class="p-card-top">
          <div class="avatar" style="background:${avatarColor(p.id)}">${initials(p.name)}</div>
          <div>
            <h3>${escapeHtml(p.name)}</h3>
            <span class="role-pill ${p.role}">${p.role==='creator'?'Creator':'Brand'}</span>
            <p class="niche">${escapeHtml(p.niche)}${p.location ? ' · ' + escapeHtml(p.location) : ''}</p>
          </div>
        </div>
        <p class="bio">${escapeHtml(p.bio)}</p>
        <p class="meta-line"><b>${escapeHtml(p.metric||'')}</b>${p.links ? ' · ' + escapeHtml(p.links) : ''}</p>
        <div class="actions">${actionHtml}</div>
      </div>`;
    }).join('');

    return `
      <h1>Discover ${oppositeRole==='brand'?'brands':'creators'}</h1>
      <p class="page-sub">${oppositeRole==='brand' ? 'Companies looking to sponsor, collaborate or promote with creators like you.' : 'Creators available for sponsorships, collaborations and promotions.'}</p>
      <div class="filter-row">
        <input id="discover-search" placeholder="Search by name or bio…" value="${escapeHtml(discoverSearch)}">
        <select id="discover-niche">
          <option value="">All niches</option>
          ${niches.map(n=>`<option value="${escapeHtml(n)}" ${discoverNiche===n?'selected':''}>${escapeHtml(n)}</option>`).join('')}
        </select>
      </div>
      ${list.length ? `<div class="card-grid">${cards}</div>` : `<div class="empty"><h3>Nobody matches yet</h3><p>Try clearing your filters.</p></div>`}
    `;
  }

  function renderComposeModal(){
    const target = directory[composeTarget];
    if(!target) return '';
    const types = ['Sponsorship','Collaboration','Promotion','Networking'];
    return `
    <div class="modal-overlay" data-act="close-compose-overlay">
      <div class="modal" onclick="event.stopPropagation()">
        <button class="modal-close-x" data-act="close-compose">×</button>
        <h2>Message ${escapeHtml(target.name)}</h2>
        <p class="page-sub" style="margin-bottom:18px;">Choose what this is about, and add a short note.</p>
        <div class="type-select">
          ${types.map(t=>`<button type="button" class="type-opt ${composeType===t?'selected':''}" data-act="pick-type" data-type="${t}">${t}</button>`).join('')}
        </div>
        <form id="compose-form">
          <div class="field">
            <label>Your note</label>
            <textarea name="message" required placeholder="Say why you'd like to connect, and what you have in mind."></textarea>
          </div>
          <button type="submit" class="btn-primary" style="width:100%;">Send request</button>
        </form>
      </div>
    </div>`;
  }

  /* ---------------- REQUESTS ---------------- */
  function renderRequests(me){
    const incoming = Object.values(requests).filter(r=>r.toId===me.id).sort((a,b)=>b.ts-a.ts);
    const outgoing = Object.values(requests).filter(r=>r.fromId===me.id).sort((a,b)=>b.ts-a.ts);
    const list = reqTab==='incoming' ? incoming : outgoing;

    const items = list.map(r=>{
      const other = directory[reqTab==='incoming' ? r.fromId : r.toId];
      if(!other) return '';
      let actions = '';
      if(reqTab==='incoming' && r.status==='pending'){
        actions = `<button class="btn-small primary" data-act="accept-req" data-id="${r.id}">Accept</button>
                   <button class="btn-small ghost" data-act="decline-req" data-id="${r.id}">Decline</button>`;
      } else if(r.status==='pending'){
        actions = `<span class="status-pill" style="background:#fdf0dc;color:#a6690a;">Pending</span>`;
      } else if(r.status==='accepted'){
        actions = `<button class="btn-small" data-act="goto-msg" data-id="${other.id}">Message</button>`;
      } else {
        actions = `<span class="status-pill declined">Declined</span>`;
      }
      return `
      <div class="req-item">
        <div class="left">
          <b>${escapeHtml(other.name)}</b><span class="type-tag">${escapeHtml(r.type)}</span>
          <div class="msg">${escapeHtml(r.message)}</div>
        </div>
        <div class="actions">${actions}</div>
      </div>`;
    }).join('');

    return `
      <h1>Requests</h1>
      <p class="page-sub">Track who's reaching out to you, and who you've reached out to.</p>
      <div class="tab-row">
        <button class="tab-btn ${reqTab==='incoming'?'active':''}" data-act="reqtab" data-t="incoming">Incoming (${incoming.length})</button>
        <button class="tab-btn ${reqTab==='outgoing'?'active':''}" data-act="reqtab" data-t="outgoing">Sent (${outgoing.length})</button>
      </div>
      ${list.length ? items : `<div class="empty"><h3>Nothing here yet</h3><p>${reqTab==='incoming' ? 'Requests sent to you will show up here.' : 'Requests you send from Discover will show up here.'}</p></div>`}
    `;
  }

  /* ---------------- MESSAGES ---------------- */
  function renderMessages(me){
    const accepted = Object.values(requests).filter(r =>
      r.status==='accepted' && (r.fromId===me.id || r.toId===me.id)
    );
    const otherIds = [...new Set(accepted.map(r => r.fromId===me.id ? r.toId : r.fromId))];
    if(!activeConv && otherIds.length) activeConv = otherIds[0];

    const convItems = otherIds.map(id=>{
      const p = directory[id];
      if(!p) return '';
      const key = convKey(me.id, id);
      const thread = messages[key] || [];
      const last = thread[thread.length-1];
      return `
      <div class="conv-item ${activeConv===id?'active':''}">
        <button data-act="open-conv" data-id="${id}">
          <b>${escapeHtml(p.name)}</b>
          <span class="last">${last ? escapeHtml(last.text) : 'Say hello 👋'}</span>
        </button>
      </div>`;
    }).join('');

    let chatHtml = `<div class="chat-empty">Accept a request to start a conversation.</div>`;
    if(activeConv && directory[activeConv]){
      const p = directory[activeConv];
      const key = convKey(me.id, activeConv);
      const thread = messages[key] || [];
      chatHtml = `
        <div class="chat-head">${escapeHtml(p.name)}</div>
        <div class="chat-body" id="chat-body">
          ${thread.map(m=>`<div class="bubble ${m.from===me.id?'mine':'theirs'}">${escapeHtml(m.text)}</div>`).join('') || '<div class="chat-empty">No messages yet. Say hello.</div>'}
        </div>
        <form class="chat-input" id="chat-form">
          <input name="text" placeholder="Write a message…" autocomplete="off">
          <button type="submit" class="btn-small primary">Send</button>
        </form>`;
    }

    return `
      <h1>Messages</h1>
      <p class="page-sub">Conversations open once a request is accepted.</p>
      <div class="msg-shell">
        <div class="conv-list">${convItems || '<div style="padding:20px;color:var(--ink-soft);font-size:13.5px;">No conversations yet.</div>'}</div>
        <div class="chat-col">${chatHtml}</div>
      </div>
    `;
  }

  /* ---------------- PROFILE TAB ---------------- */
  function renderProfileTab(me){
    if(profileEditing){
      const isCreator = me.role==='creator';
      return `
      <h1>Edit profile</h1>
      <p class="page-sub">Update what others see about you on Try.</p>
      <form id="edit-form" style="max-width:480px;">
        <div class="field"><label>${isCreator?'Your name':'Company name'}</label><input name="name" required value="${escapeHtml(me.name)}"></div>
        <div class="field-row">
          <div class="field"><label>${isCreator?'Content niche':'Industry'}</label><input name="niche" required value="${escapeHtml(me.niche)}"></div>
          <div class="field"><label>Location</label><input name="location" value="${escapeHtml(me.location||'')}"></div>
        </div>
        <div class="field"><label>${isCreator?'Reach':'Typical budget'}</label><input name="metric" required value="${escapeHtml(me.metric||'')}"></div>
        <div class="field"><label>${isCreator?'Instagram / YouTube / website':'Website'}</label><input name="links" value="${escapeHtml(me.links||'')}"></div>
        <div class="field"><label>Short bio</label><textarea name="bio" required>${escapeHtml(me.bio)}</textarea></div>
        <div class="profile-form-actions">
          <button type="button" class="btn-secondary" data-act="cancel-edit">Cancel</button>
          <button type="submit" class="btn-primary">Save changes</button>
        </div>
      </form>`;
    }
    return `
      <h1>My Profile</h1>
      <p class="page-sub">This is exactly what ${me.role==='creator'?'brands':'creators'} see when they discover you.</p>
      <div class="p-card profile-view" style="max-width:480px;">
        <div class="p-header">
          <div class="avatar" style="background:${avatarColor(me.id)}">${initials(me.name)}</div>
          <div>
            <h3 style="margin:0;">${escapeHtml(me.name)}</h3>
            <span class="role-pill ${me.role}">${me.role==='creator'?'Creator':'Brand'}</span>
          </div>
        </div>
        <p class="niche">${escapeHtml(me.niche)}${me.location ? ' · ' + escapeHtml(me.location) : ''}</p>
        <p class="bio">${escapeHtml(me.bio)}</p>
        <p class="meta-line"><b>${escapeHtml(me.metric||'')}</b></p>
        <div class="p-links">${escapeHtml(me.links||'')}</div>
        <button class="btn-small" style="margin-top:16px;" data-act="edit-profile">Edit profile</button>
      </div>
    `;
  }

  /* ---------------- EVENT HANDLING ---------------- */
  function attachHandlers(){
    root.querySelectorAll('[data-act]').forEach(el=>{
      el.addEventListener('click', onAction);
    });
    const pf = document.getElementById('profile-form');
    if(pf) pf.addEventListener('submit', onCreateProfile);
    const cf = document.getElementById('compose-form');
    if(cf) cf.addEventListener('submit', onSendRequest);
    const chf = document.getElementById('chat-form');
    if(chf) chf.addEventListener('submit', onSendMessage);
    const ef = document.getElementById('edit-form');
    if(ef) ef.addEventListener('submit', onSaveEdit);
    const ds = document.getElementById('discover-search');
    if(ds) ds.addEventListener('input', e=>{ discoverSearch = e.target.value; render(); preserveFocus('discover-search'); });
    const dn = document.getElementById('discover-niche');
    if(dn) dn.addEventListener('change', e=>{ discoverNiche = e.target.value; render(); });
    const cb = document.getElementById('chat-body');
    if(cb) cb.scrollTop = cb.scrollHeight;
  }

  function preserveFocus(id){
    const el = document.getElementById(id);
    if(el){ el.focus(); const v=el.value; el.value=''; el.value=v; }
  }

  function onAction(e){
    const el = e.currentTarget;
    const act = el.getAttribute('data-act');
    if(act==='start'){ view='onboard-role'; render(); }
    else if(act==='browse'){ onboardRole='creator'; myId=null; view='onboard-role'; render(); }
    else if(act==='to-landing'){ view='landing'; render(); }
    else if(act==='to-role'){ view='onboard-role'; render(); }
    else if(act==='pick-role'){ onboardRole = el.getAttribute('data-role'); view='onboard-profile'; render(); }
    else if(act==='tab'){ appTab = el.getAttribute('data-tab'); render(); }
    else if(act==='reqtab'){ reqTab = el.getAttribute('data-t'); render(); }
    else if(act==='logout'){ myId=null; persistMyId(); view='landing'; appTab='discover'; render(); }
    else if(act==='open-compose'){ composeTarget = el.getAttribute('data-id'); composeType='Collaboration'; render(); }
    else if(act==='close-compose' || act==='close-compose-overlay'){ if(e.target===el){ composeTarget=null; render(); } }
    else if(act==='pick-type'){ composeType = el.getAttribute('data-type'); render(); }
    else if(act==='accept-req'){ respondRequest(el.getAttribute('data-id'), 'accepted'); }
    else if(act==='decline-req'){ respondRequest(el.getAttribute('data-id'), 'declined'); }
    else if(act==='goto-msg'){ appTab='messages'; activeConv = el.getAttribute('data-id'); render(); }
    else if(act==='open-conv'){ activeConv = el.getAttribute('data-id'); render(); }
    else if(act==='edit-profile'){ profileEditing=true; render(); }
    else if(act==='cancel-edit'){ profileEditing=false; render(); }
  }

  async function onCreateProfile(e){
    e.preventDefault();
    const fd = new FormData(e.target);
    const id = uid('user');
    const profile = {
      id, role: onboardRole,
      name: fd.get('name').trim(),
      niche: fd.get('niche').trim(),
      location: (fd.get('location')||'').trim(),
      metric: fd.get('metric').trim(),
      links: (fd.get('links')||'').trim(),
      bio: fd.get('bio').trim(),
      createdAt: Date.now()
    };
    directory[id] = profile;
    myId = id;
    await persistDirectory();
    await persistMyId();
    view='app'; appTab='discover';
    render();
    showToast('Profile created — welcome to Try.');
  }

  async function onSendRequest(e){
    e.preventDefault();
    const fd = new FormData(e.target);
    const id = uid('req');
    requests[id] = {
      id, fromId: myId, toId: composeTarget,
      type: composeType, message: fd.get('message').trim(),
      status: 'pending', ts: Date.now()
    };
    await persistRequests();
    composeTarget = null;
    render();
    showToast('Request sent.');
  }

  async function respondRequest(id, status){
    if(!requests[id]) return;
    requests[id].status = status;
    await persistRequests();
    render();
    showToast(status==='accepted' ? 'Request accepted — you can now message them.' : 'Request declined.');
  }

  async function onSendMessage(e){
    e.preventDefault();
    const fd = new FormData(e.target);
    const text = (fd.get('text')||'').trim();
    if(!text || !activeConv) return;
    const key = convKey(myId, activeConv);
    if(!messages[key]) messages[key] = [];
    messages[key].push({from: myId, text, ts: Date.now()});
    await persistMessages();
    e.target.reset();
    render();
    const cb = document.getElementById('chat-body');
    if(cb) cb.scrollTop = cb.scrollHeight;
  }

  async function onSaveEdit(e){
    e.preventDefault();
    const fd = new FormData(e.target);
    const me = directory[myId];
    me.name = fd.get('name').trim();
    me.niche = fd.get('niche').trim();
    me.location = (fd.get('location')||'').trim();
    me.metric = fd.get('metric').trim();
    me.links = (fd.get('links')||'').trim();
    me.bio = fd.get('bio').trim();
    await persistDirectory();
    profileEditing = false;
    render();
    showToast('Profile updated.');
  }

  boot();
})();
</script>
</body>
</html>
